[project]
name = "ml1"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "matplotlib>=3.11.2",
    # scikit-learn: pandas, matplotlib, numpy, scipy
    "scikit-learn==1.9.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "torchviz>=0.0.3",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "E501", # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
